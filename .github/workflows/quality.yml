name: Source quality
on:
  push:
    paths: ["apps/web/**", "functions/**", "shared/**", "agent/**", "services/**", "scripts/**", "tests/**", "workflows/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/quality.yml"]
  pull_request:
    paths: ["apps/web/**", "functions/**", "shared/**", "agent/**", "services/**", "scripts/**", "tests/**", "workflows/**", "pyproject.toml", "requirements-dev.txt", ".github/workflows/quality.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m ruff format --check scripts/deploy_scope.py functions/event_contract.py services/mcp/token_auth.py tests/test_deploy_scope.py tests/test_event_contract.py tests/test_mcp_auth.py tests/test_mcp_proxy.py tests/test_mcp_server.py
      - run: python -m mypy
      - run: python -m unittest discover -s tests
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: node --test tests/*.test.mjs
      - run: npm run build
        working-directory: apps/web
