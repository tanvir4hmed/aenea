name: Reconcile deployment role

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: aenea-demo-deployment
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: demo
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - name: Update only bootstrap role and policies
        run: |
          terraform -chdir=infra/bootstrap init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/bootstrap apply -input=false -auto-approve \
            -var="state_bucket=$TF_STATE_BUCKET"
      - name: Start normal OIDC deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 'Deploy changed components' --repo "$GITHUB_REPOSITORY" --ref main -f component=all
