name: Reconcile deployment role

on:
  workflow_dispatch:
    inputs:
      start_deploy:
        description: Start normal OIDC deployment after reconciliation
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: aenea-demo-deployment
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    environment: demo
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: demo
      TF_VAR_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - name: Adopt and update bootstrap role and policies
        run: python scripts/reconcile_bootstrap.py
      - name: Show resulting OIDC trust
        run: aws iam get-role --role-name aenea-demo-github --query 'Role.AssumeRolePolicyDocument' --output json
      - name: Start normal OIDC deployment
        if: inputs.start_deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run 'Deploy changed components' --repo "$GITHUB_REPOSITORY" --ref main -f component=all
